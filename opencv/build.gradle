//
// Notes about integration OpenCV into existed Android Studio application project are below (application 'app' module should exist).
//
// This file is located in <OpenCV-android-sdk>/sdk directory (near 'etc', 'java', 'native' subdirectories)
//
// Add module into Android Studio application project:
//
// - Android Studio way:
//   (will copy almost all OpenCV Android SDK into your project, ~200Mb)
//
//   Import module: Menu -> "File" -> "New" -> "Module" -> "Import Gradle project":
//   Source directory: select this "sdk" directory
//   Module name: ":opencv"
//
// - or attach library module from OpenCV Android SDK
//   (without copying into application project directory, allow to share the same module between projects)
//
//   Edit "settings.gradle" and add these lines:
//
//   def opencvsdk='<path_to_opencv_android_sdk_rootdir>'
//   // You can put declaration above into gradle.properties file instead (including file in HOME directory),
//   // but without 'def' and apostrophe symbols ('): opencvsdk=<path_to_opencv_android_sdk_rootdir>
//   include ':opencv'
//   project(':opencv').projectDir = new File(opencvsdk + '/sdk')
//
//
//
// Add dependency into application module:
//
// - Android Studio way:
//   "Open Module Settings" (F4) -> "Dependencies" tab
//
// - or add "project(':opencv')" dependency into app/build.gradle:
//
//   dependencies {
//       implementation fileTree(dir: 'libs', include: ['*.jar'])
//       ...
//       implementation project(':opencv')
//   }
//
//
//
// Load OpenCV native library before using:
//
// - avoid using of "OpenCVLoader.initAsync()" approach - it is deprecated
//   It may load library with different version (from OpenCV Android Manager, which is installed separatelly on device)
//
// - use "System.loadLibrary("opencv_java4")" or "OpenCVLoader.initDebug()"
//   TODO: Add accurate API to load OpenCV native library
//
//
//
// Native C++ support (necessary to use OpenCV in native code of application only):
//
// - Use find_package() in app/CMakeLists.txt:
//
//   find_package(OpenCV 4.12 REQUIRED java)
//   ...
//   target_link_libraries(native-lib ${OpenCV_LIBRARIES})
//
// - Add "OpenCV_DIR" and enable C++ exceptions/RTTI support via app/build.gradle
//   Documentation about CMake options: https://developer.android.com/ndk/guides/cmake.html
//
//   defaultConfig {
//       ...
//       externalNativeBuild {
//           cmake {
//               cppFlags "-std=c++11 -frtti -fexceptions"
//               arguments "-DOpenCV_DIR=" + opencvsdk + "/sdk/native/jni" // , "-DANDROID_ARM_NEON=TRUE"
//           }
//       }
//   }
//
// - (optional) Limit/filter ABIs to build ('android' scope of 'app/build.gradle'):
//   Useful information: https://developer.android.com/studio/build/gradle-tips.html (Configure separate APKs per ABI)
//
//   splits {
//       abi {
//           enable true
//           universalApk false
//           reset()
//           include 'armeabi-v7a' // , 'x86', 'x86_64', 'arm64-v8a'
//       }
//   }
//

apply plugin: 'com.android.library'
// Kanso: the Android Gradle Plugin 9 compiles Kotlin itself (built-in Kotlin), so the separate Kotlin
// plugin OpenCV tried to apply here is gone; OpenCV's Kotlin sources (java/src/**/*.kt) are made
// known to it in the sourceSets block below.
println "Configure OpenCV with Kotlin"

def openCVersionName = "4.12.0-dev"
def openCVersionCode = ((4 * 100 + 12) * 100 + 0) * 10 + 0

println "OpenCV: " +openCVersionName + " " + project.buildscript.sourceFile

android {
    namespace = 'org.opencv'
    compileSdk = 35
    // Kanso: the NDK that builds libcxx_helper and supplies libc++_shared.so, as before the Android
    // Gradle Plugin 9 move; its own default is a newer NDK, which would change libc++_shared.so.
    ndkVersion = '27.0.12077973'

    defaultConfig {
        minSdk = 21
        // Kanso: a library module takes no targetSdk, versionCode or versionName in the Android
        // Gradle Plugin 9 DSL (only an app has them); OpenCV's version stays in openCVersionName and
        // openCVersionCode above.

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                targets "opencv_jni_shared"
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_22
        targetCompatibility = JavaVersion.VERSION_22
    }

    buildTypes {
        release {
            minifyEnabled = false
            // Kanso: 'proguard-android.txt' is refused from the Android Gradle Plugin 9 on (it turns
            // R8's optimisations off), and OpenCV ships no 'proguard-rules.txt' in this module.
            // Minify is off, so neither file changes the output.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    // Kanso: OpenCV listed this under both build types, but it always set the module-wide option;
    // the Android Gradle Plugin 9 DSL names it packaging.jniLibs.keepDebugSymbols.
    packaging {
        jniLibs {
            keepDebugSymbols.add('**/*.so')  // controlled by OpenCV CMake scripts
        }
    }

    sourceSets {
        main {
            jniLibs.setSrcDirs(['native/libs'])
            java.setSrcDirs(['java/src'])
            // Built-in Kotlin does not take .kt files from the java source set, so name the folder as
            // a Kotlin source directory too (it holds MatMatMul.kt, which becomes org.opencv.core.MatMatMulKt).
            kotlin.directories.add('java/src')
            res.setSrcDirs(['java/res'])
            manifest.srcFile 'java/AndroidManifest.xml'
        }
    }

    externalNativeBuild {
        cmake {
            path = file(project.projectDir.toString() + '/libcxx_helper/CMakeLists.txt')
        }
    }

    buildFeatures {
        prefabPublishing = true
        buildConfig = true
    }

    prefab {
        opencv_jni_shared {
            headers = 'native/jni/include'
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }

}

// Kanso: keep Kotlin's bytecode target in step with the Java target above (22), as the core
// modules do, so the Kotlin and Java compile tasks agree. The plugin's built-in Kotlin always
// provides this kotlin block, so it no longer waits for a separate Kotlin plugin.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_22)
    }
}

dependencies {
}
